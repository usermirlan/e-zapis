{% extends 'base.html' %}
{% load static %}

{% block title %}403 — Доступ ограничен{% endblock %}

{% block extra_css %}
<style>
    .error-wrapper {
        min-height: 85vh;
        background: radial-gradient(circle at 10% 20%, rgba(220, 38, 38, 0.08) 0%, transparent 40%),
                    radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.08) 0%, transparent 40%);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
    }

    .glass-error-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 40px;
        padding: 4rem 3rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        max-width: 600px;
        width: 90%;
        text-align: center;
        position: relative;
        z-index: 10;
        animation: cardFloat 6s ease-in-out infinite;
    }

    @keyframes cardFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }

    .error-number {
        font-size: 10rem;
        font-weight: 900;
        line-height: 0.8;
        background: linear-gradient(135deg, #dc2626 0%, #f59e0b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 2rem;
        letter-spacing: -10px;
        opacity: 0.9;
        filter: drop-shadow(0 10px 20px rgba(220, 38, 38, 0.2));
    }

    .floating-shield {
        font-size: 6rem;
        color: #dc2626;
        position: absolute;
        top: -40px;
        left: -30px;
        opacity: 0.15;
        transform: rotate(-15deg);
        animation: shieldFloat 8s ease-in-out infinite;
    }

    @keyframes shieldFloat {
        0%, 100% { transform: rotate(-15deg) translate(0, 0); }
        50% { transform: rotate(-5deg) translate(20px, 20px); }
    }

    .btn-premium-red {
        background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
        color: white;
        border: none;
        padding: 1.25rem 3rem;
        border-radius: 50px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 30px rgba(220, 38, 38, 0.4);
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
    }

    .btn-premium-red:hover {
        transform: scale(1.05) translateY(-5px);
        box-shadow: 0 20px 40px rgba(220, 38, 38, 0.6);
        color: white;
    }

    .abstract-shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        z-index: 1;
        opacity: 0.3;
    }

    .shape-1 { width: 300px; height: 300px; background: #dc2626; top: 10%; left: 10%; animation: move 20s infinite alternate; }
    .shape-2 { width: 400px; height: 400px; background: #f59e0b; bottom: 10%; right: 10%; animation: move 25s infinite alternate-reverse; }

    @keyframes move {
        from { transform: translate(0, 0); }
        to { transform: translate(100px, 100px); }
    }
</style>
{% endblock %}

{% block content %}
<div class="error-wrapper">
    <div class="abstract-shape shape-1"></div>
    <div class="abstract-shape shape-2"></div>

    <div class="glass-error-card">
        <div class="floating-shield">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        
        <div class="error-number">403</div>
        <h1 class="display-5 fw-bold mb-3 text-dark">Доступ ограничен</h1>
        <p class="text-secondary lead mb-5 px-md-5">
            Это защищенная зона поликлиники. Похоже, у вас недостаточно прав для посещения этого раздела.
        </p>
        
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
            <a href="{% url 'home' %}" class="btn-premium-red">
                <i class="bi bi-house-heart"></i> На главную
            </a>
        </div>
    </div>
</div>
{% endblock %}
