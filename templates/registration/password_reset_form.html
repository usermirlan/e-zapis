{% extends 'base.html' %}
{% block title %}Восстановление пароля — МедЗапись{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-key text-primary me-2"></i>Забыли пароль?</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-4">Введите ваш email адрес и мы отправим инструкции по восстановлению
                        пароля.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_email" class="form-label fw-semibold">Email адрес</label>
                            <input type="email" name="email" id="id_email" class="form-control"
                                placeholder="example@mail.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-send me-1"></i>Отправить инструкции
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'login' %}" class="text-muted small">
                            <i class="bi bi-arrow-left me-1"></i>Вернуться ко входу
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
