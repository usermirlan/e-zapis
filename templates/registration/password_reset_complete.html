{% extends 'base.html' %}
{% block title %}Пароль изменён — МедЗапись{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <i class="bi bi-shield-check fs-1 text-success mb-3"></i>
                    <h4 class="fw-bold mb-2">Пароль успешно изменён!</h4>
                    <p class="text-muted">Теперь вы можете войти с новым паролем.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary mt-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Войти в аккаунт
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
