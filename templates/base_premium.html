{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}МедЗапись — Онлайн-запись к врачу{% endblock %}</title>
  <meta name="description" content="Онлайн-запись в поликлинику нового поколения. Запишитесь к лучшим врачам быстро и удобно.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  

  <!-- Класс js: скрытие блоков до анимации появления включается только при работающем JS -->
  <script>document.documentElement.classList.add('js');</script>


  <style>
    /* ============================================================
       ROOT - LIGHT PREMIUM (MEDICAL)
    ============================================================ */
    :root {
      /* Medical Blues & Teals instead of Gold */
      --gold:       #0ea5e9; /* Sky Blue */
      --gold-d:     #0284c7; /* Darker Blue */
      --gold-glow:  rgba(14, 165, 233, 0.25);
      --blue:       #3b82f6;
      --violet:     #6366f1; /* Indigo instead of violet */
      --cyan:       #06b6d4;
      --emerald:    #10b981;
      --rose:       #f43f5e;
      
      /* Light Backgrounds */
      --dark:       #f4f7fa; /* Page Background: чуть темнее белых карточек, чтобы они отделялись */
      --dark2:      #ffffff; /* Card Background */
      --dark3:      #f1f5f9; /* Secondary Background */
      
      /* Dark Text for Light Theme */
      --text-main:  #0f172a;
      --text-muted: #334155; /* контраст ≥ 7:1 на светлом фоне */
      --text-light: #64748b; /* было #94a3b8 (контраст 2.6:1) */
      
      /* Borders & Glass */
      --glass:      rgba(255,255,255,0.7);
      --glass-b:    rgba(255,255,255,0.9);
      --border:     rgba(15,23,42,0.09);
      
      --f1:         'Inter', sans-serif;
      --f2:         'Inter', sans-serif;
      --ease:       cubic-bezier(.16,1,.3,1);
    }

    /* ============================================================
       DARK THEME
    ============================================================ */
    body.dark-theme {
      --dark:       #060d1f;
      --dark2:      #0d1b35;
      --dark3:      #1a2845;
      --text-main:  #f1f5f9;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --glass:      rgba(6,13,31,0.7);
      --glass-b:    rgba(6,13,31,0.92);
      --border:     rgba(255,255,255,0.08);
    }

    /* ============================================================
       ANIMATED BACKGROUND - DARK THEME
    ============================================================ */
    body.dark-theme::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(14,165,233,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(99,102,241,0.16) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 55% 50%, rgba(6,182,212,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 70% 60% at 10% 90%, rgba(16,185,129,0.10) 0%, transparent 50%),
        #060d1f;
      animation: bgShift 14s ease-in-out infinite alternate;
    }
    body.dark-theme::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(14,165,233,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14,165,233,0.04) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 80%);
    }
    @keyframes bgShift {
      0%   { background-position: 0% 0%, 100% 100%, 50% 50%, 0% 100%; }
      50%  { background-position: 15% 20%, 85% 75%, 60% 40%, 10% 85%; }
      100% { background-position: 30% 10%, 70% 90%, 40% 60%, 5% 95%; }
    }

    /* Floating orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
      animation: orbFloat linear infinite;
      opacity: 0;
      transition: opacity 0.5s;
    }
    body.dark-theme .bg-orb { opacity: 1; }
    .bg-orb-1 {
      width: 500px; height: 500px;
      top: -100px; left: -100px;
      background: radial-gradient(circle, rgba(14,165,233,0.22) 0%, transparent 70%);
      animation-duration: 20s;
    }
    .bg-orb-2 {
      width: 400px; height: 400px;
      bottom: -80px; right: -80px;
      background: radial-gradient(circle, rgba(99,102,241,0.20) 0%, transparent 70%);
      animation-duration: 25s;
      animation-direction: reverse;
    }
    .bg-orb-3 {
      width: 300px; height: 300px;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 70%);
      animation-duration: 18s;
    }
    @keyframes orbFloat {
      0%   { transform: translate(0px, 0px) scale(1); }
      25%  { transform: translate(30px, -40px) scale(1.05); }
      50%  { transform: translate(-20px, 30px) scale(0.97); }
      75%  { transform: translate(40px, 20px) scale(1.03); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .bg-orb-3 { animation-name: orbFloat3; }
    @keyframes orbFloat3 {
      0%   { transform: translate(-50%,-50%) scale(1); }
      33%  { transform: translate(calc(-50% + 50px), calc(-50% - 30px)) scale(1.1); }
      66%  { transform: translate(calc(-50% - 40px), calc(-50% + 50px)) scale(0.9); }
      100% { transform: translate(-50%,-50%) scale(1); }
    }
    body.dark-theme .pnav {
      background: rgba(10,15,30,0.6);
    }
    body.dark-theme .pnav.scrolled {
      background: rgba(10,15,30,0.92);
      border-bottom-color: rgba(255,255,255,0.06);
      box-shadow: 0 4px 40px rgba(0,0,0,0.3);
    }
    body.dark-theme .doc-card,
    body.dark-theme .srv-card {
      background: var(--dark2);
      border-color: var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    body.dark-theme .doc-card-top {
      background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 55%, #0f172a 100%);
    }
    body.dark-theme .doc-avatar {
      border-color: var(--dark2);
    }
    body.dark-theme .pfooter {
      background: var(--dark2);
      border-top-color: var(--border);
    }
    body.dark-theme .p-search-inner {
      background: var(--dark2);
      border-color: var(--border);
    }
    body.dark-theme .pill {
      background: var(--dark2);
      border-color: var(--border);
    }
    body.dark-theme .dropdown-btn {
      background: var(--dark2);
      border-color: var(--border);
    }
    body.dark-theme .dropdown-content {
      background: rgba(17,24,39,.98);
      border-color: var(--border);
    }
    body.dark-theme .dropdown-content a {
      border-bottom-color: var(--border);
    }
    body.dark-theme .dropdown-content a:hover {
      background: var(--dark3);
    }
    body.dark-theme .srv-ico {
      background: var(--dark3);
      border-color: var(--border);
    }
    body.dark-theme .srv-arrow {
      background: var(--dark3);
      border-color: var(--border);
    }
    body.dark-theme .btn-book {
      background: rgba(14,165,233,0.1);
    }
    body.dark-theme .ds + .ds {
      border-left-color: var(--border);
    }
    body.dark-theme .ds-v.gold {
      color: #fbbf24;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    html { font-size: 17px; overflow-x: clip; } /* крупнее базовый шрифт для пожилых пациентов */
    body {
      font-family: var(--f1);
      background: var(--dark);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Light theme soft background */
    body:not(.dark-theme) {
      background:
        radial-gradient(ellipse 70% 50% at 20% 10%, rgba(14,165,233,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(99,102,241,0.05) 0%, transparent 55%),
        var(--dark);
    }

    /* Ensure content is above bg layers */
    .pnav, .main-content, .pfooter {
      position: relative;
      z-index: 1;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--dark3); }
    ::-webkit-scrollbar-thumb { background: var(--gold-d); border-radius: 4px; }


    /* ============================================================
       CANVAS PARTICLES
    ============================================================ */
    #bg-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    /* ============================================================
       NAVBAR
    ============================================================ */
    .pnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 1.25rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: all .4s var(--ease);
    }
    .pnav.scrolled {
      padding: .75rem 2rem;
      background: rgba(255,255,255,0.92);
      border-bottom-color: rgba(0,0,0,0.08);
      box-shadow: 0 4px 40px rgba(0,0,0,0.04);
    }

    .nav-logo { display: flex; align-items: center; gap: .75rem; text-decoration: none; }
    .logo-pulse-wrap {
      width: 44px; height: 44px;
      background: rgba(14,165,233,0.12);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(14,165,233,0.25);
    }
    /* Dual Pulse Ping Light Waves */
    .logo-pulse-wrap::before,
    .logo-pulse-wrap::after {
      content: ''; position: absolute;
      inset: 0;
      border-radius: 14px;
      border: 2px solid var(--gold);
      pointer-events: none;
    }
    .logo-pulse-wrap::before {
      animation: pulsePing72 0.833s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .logo-pulse-wrap::after {
      animation: pulsePing72 0.833s cubic-bezier(0.215, 0.61, 0.355, 1) 0.15s infinite;
    }

    .logo-pulse-icon {
      font-size: 1.45rem;
      color: #0ea5e9;
      animation: heartbeat72 0.833s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(14, 165, 233, 0.8));
    }

    /* Real 72 BPM Dual Pulse Keyframes (0.833s per beat) */
    @keyframes pulsePing72 {
      0% {
        transform: scale(1);
        opacity: 0.9;
        border-color: rgba(14, 165, 233, 0.9);
        box-shadow: 0 0 10px rgba(14, 165, 233, 0.6);
      }
      50% {
        opacity: 0.5;
        border-color: rgba(99, 102, 241, 0.5);
      }
      100% {
        transform: scale(1.65);
        opacity: 0;
        border-color: rgba(6, 182, 212, 0);
        box-shadow: 0 0 25px rgba(14, 165, 233, 0);
      }
    }

    @keyframes heartbeat72 {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 6px rgba(14, 165, 233, 0.5));
      }
      12% {
        /* Lub (First systole pulse) */
        transform: scale(1.22);
        color: #38bdf8;
        filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.95)) drop-shadow(0 0 25px rgba(14, 165, 233, 0.8));
      }
      24% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 8px rgba(14, 165, 233, 0.6));
      }
      38% {
        /* Dub (Second systole pulse) */
        transform: scale(1.32);
        color: #60a5fa;
        filter: drop-shadow(0 0 22px rgba(96, 165, 250, 1)) drop-shadow(0 0 35px rgba(14, 165, 233, 0.9));
      }
      60%, 100% {
        /* Diastole rest */
        transform: scale(1);
        color: #0ea5e9;
        filter: drop-shadow(0 0 6px rgba(14, 165, 233, 0.5));
      }
    }


    .logo-txt { font-family: var(--f2); font-size: 1.3rem; font-weight: 800; color: var(--text-main); letter-spacing: -.3px; }
    .logo-txt span { color: var(--gold); }

    .nav-links { display: flex; gap: .1rem; list-style: none; }
    .nav-links a {
      color: var(--text-muted); text-decoration: none;
      padding: .5rem 1rem; border-radius: 8px;
      font-weight: 600; font-size: .9rem; transition: all .2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--gold-d); background: rgba(14,165,233,0.08); }

    .nav-acts { display: flex; align-items: center; gap: .65rem; }

    .btn-outline-g {
      padding: .5rem 1.2rem; border-radius: 10px;
      border: 1.5px solid var(--gold); color: var(--gold-d);
      font-weight: 600; font-size: .85rem; text-decoration: none;
      transition: all .3s; background: transparent;
    }
    .btn-outline-g:hover { background: var(--gold); color: #fff; box-shadow: 0 4px 14px var(--gold-glow); border-color: var(--gold); }

    .btn-gold-nav {
      padding: .55rem 1.4rem; border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), var(--blue));
      color: #fff; font-weight: 700; font-size: .85rem;
      text-decoration: none; border: none;
      box-shadow: 0 4px 14px var(--gold-glow);
      transition: all .3s; position: relative; overflow: hidden;
    }
    .btn-gold-nav::before {
      content: ''; position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
      transition: left .5s;
    }
    .btn-gold-nav:hover::before { left: 100%; }
    .btn-gold-nav:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--gold-glow); color: #fff; }

    /* ============================================================
       LAYOUT & SECTIONS
    ============================================================ */
    .main-content {
      flex: 1;
      padding-top: 80px; /* offset for navbar */
      position: relative;
      z-index: 2;
    }

    .section { position: relative; z-index: 2; padding: 5.5rem 2rem; }
    .s-inner { max-width: 1200px; margin: 0 auto; }
    .s-head { text-align: center; margin-bottom: 3.5rem; }
    .s-tag {
      display: inline-block;
      background: rgba(14,165,233,0.1); color: var(--gold-d);
      border: 1px solid rgba(14,165,233,0.2);
      padding: .32rem .95rem; border-radius: 50px;
      font-size: .75rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: .9rem;
    }
    .s-title {
      font-family: var(--f2); font-size: clamp(1.75rem,3vw,2.75rem);
      font-weight: 900; color: var(--text-main); line-height: 1.15;
      letter-spacing: -1px; margin-bottom: .85rem;
    }
    .s-desc { color: var(--text-muted); font-size: 1rem; line-height: 1.72; max-width: 500px; margin: 0 auto; }

    /* ============================================================
       COMPONENTS (Cards, Buttons, Inputs)
    ============================================================ */
    /* Shared Input/Search styling */
    .p-search {
      display: flex; gap: .5rem; margin-bottom: 2rem;
    }
    .p-search-inner {
      flex: 1; display: flex; align-items: center;
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.08);
      border-radius: 12px; overflow: hidden;
      transition: all .3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }
    .p-search-inner:focus-within { border-color: var(--gold); box-shadow: 0 4px 24px var(--gold-glow); }
    .p-search-inner span { padding: 0 1rem; color: var(--text-light); }
    .p-search-inner input {
      background: transparent; border: none; outline: none;
      color: var(--text-main); font-size: 1rem; font-family: var(--f1);
      padding: 1rem 0; flex: 1; min-width: 0; /* иначе поле не сжимается и ломает ширину на телефоне */
    }
    .p-search-inner input::placeholder { color: var(--text-light); }
    .btn-search {
      padding: 1rem 1.5rem; background: var(--gold);
      border: none; color: #fff; font-weight: 700;
      font-size: .95rem; cursor: pointer; transition: all .2s;
    }
    .btn-search:hover { background: var(--gold-d); }

    /* Doctor cards */
    .docs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.8rem;
    }
    .doc-card {
      border-radius: 22px; overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--border);
      transition: all .4s var(--ease);
      position: relative;
      display: flex; flex-direction: column;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06);
    }
    .doc-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: rgba(14,165,233,0.3);
      box-shadow: 0 28px 60px rgba(14,165,233,0.12), 0 0 36px rgba(14,165,233,0.05);
    }
    .doc-card-top {
      height: 110px;
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 55%, #7dd3fc 100%);
      position: relative;
    }
    .doc-verified {
      position: absolute; top: 12px; right: 12px;
      background: rgba(255,255,255,.6); backdrop-filter: blur(6px);
      border-radius: 8px; padding: 4px 10px;
      font-size: .68rem; color: var(--gold-d); font-weight: 800;
      border: 1px solid rgba(255,255,255,0.8);
    }
    .doc-avatar {
      position: absolute; bottom: -45px; left: 50%;
      transform: translateX(-50%);
      width: 90px; height: 90px; border-radius: 50%;
      border: 4px solid #ffffff;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      background: var(--dark3);
    }
    .doc-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .doc-avatar .initials {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--f2); font-size: 1.6rem; font-weight: 900; color: #fff;
    }
    .doc-body { padding: 3.5rem 1.5rem 1.8rem; text-align: center; flex: 1; display: flex; flex-direction: column; }
    .doc-name { font-family: var(--f2); font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin-bottom: .4rem; }
    .doc-spec {
      display: inline-block;
      background: rgba(14,165,233,.1); color: var(--gold-d);
      font-size: .8rem; font-weight: 700;
      padding: .3rem .9rem; border-radius: 20px;
      margin-bottom: 1.2rem; align-self: center;
    }
    .doc-stats { display: flex; justify-content: center; gap: 0; margin-bottom: 1.2rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: .8rem 0; }
    .ds { flex: 1; text-align: center; }
    .ds + .ds { border-left: 1px solid var(--border); }
    .ds-v { font-family: var(--f2); font-size: 1.1rem; font-weight: 800; color: var(--text-main); }
    .ds-v.gold { color: #f59e0b; }
    .ds-l { font-size: .65rem; color: var(--text-light); text-transform: uppercase; letter-spacing: .3px; font-weight: 600;}
    .doc-bio { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.6; }
    
    .btn-book {
      display: block; text-align: center;
      background: rgba(14,165,233,0.06);
      border: 1.5px solid rgba(14,165,233,0.3); color: var(--gold-d);
      padding: .8rem; border-radius: 12px; font-weight: 700;
      font-size: .95rem; text-decoration: none;
      transition: all .3s; margin-top: auto;
    }
    .btn-book:hover { background: linear-gradient(135deg, var(--gold), var(--blue)); color: #fff; border-color: transparent; transform: translateY(-2px); box-shadow: 0 8px 22px var(--gold-glow); }

    /* Service cards */
    .srv-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.8rem;
    }
    .srv-card {
      position: relative; border-radius: 22px; padding: 2rem;
      background: #ffffff;
      border: 1px solid var(--border);
      transition: all .4s var(--ease);
      cursor: pointer; overflow: hidden;
      transform-style: preserve-3d;
      text-decoration: none; display: block;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06);
    }
    .srv-card::before {
      content: ''; position: absolute; inset: 0; border-radius: 22px;
      background: radial-gradient(circle at top right, var(--glow,rgba(14,165,233,.05)), transparent 60%);
      opacity: 0; transition: opacity .4s;
    }
    .srv-card:hover::before { opacity: 1; }
    .srv-card:hover {
      transform: translateY(-11px) rotateX(5deg) rotateY(-3deg);
      border-color: var(--bdr, rgba(14,165,233,.3));
      box-shadow: 0 28px 60px rgba(0,0,0,.08), 0 0 35px var(--glow,rgba(14,165,233,.15));
    }
    .srv-card.c-gd  { --glow:rgba(14,165,233,.12); --bdr:rgba(14,165,233,.3); }
    .srv-card.c-vt  { --glow:rgba(99,102,241,.12); --bdr:rgba(99,102,241,.3); }
    .srv-card.c-cy  { --glow:rgba(6,182,212,.12);  --bdr:rgba(6,182,212,.3); }
    .srv-card.c-em  { --glow:rgba(16,185,129,.12);  --bdr:rgba(16,185,129,.3); }
    .srv-card.c-bl  { --glow:rgba(59,130,246,.12);  --bdr:rgba(59,130,246,.3); }

<script>
/* ================================================
   THEME TOGGLE
================================================ */
document.addEventListener('DOMContentLoaded', function(){
  const btn = document.getElementById('themeToggle');
  if(btn){
    btn.addEventListener('click', function(){
      document.body.classList.toggle('dark-theme');
      const isDark = document.body.classList.contains('dark-theme');
      localStorage.setItem('ezapis-theme', isDark ? 'dark' : 'light');
    });
  }
});

/* ================================================
   PARTICLE CANVAS (adapts to theme)
================================================ */
/* ================================================
   MEDICAL CANVAS ANIMATION (ECG, Crosses, Pulses)
================================================ */
(function(){
  const cv = document.getElementById('bg-canvas');
  if(!cv) return;
  const cx = cv.getContext('2d');
  let W, H;

  function isDark(){ return document.body.classList.contains('dark-theme'); }

  function resize(){
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // --- 1. Floating Hexagonal Bio-Molecules & Micro-Capsules ---
  class BioMolecule {
    constructor(){ this.reset(); }
    reset(){
      this.x = Math.random() * W;
      this.y = H + Math.random() * 100;
      this.size = Math.random() * 12 + 8;
      this.speed = Math.random() * 0.35 + 0.15;
      this.alpha = Math.random() * 0.3 + 0.08;
      this.rot = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random() - 0.5) * 0.008;
      this.isHex = Math.random() > 0.4; // 60% hexagons, 40% micro-capsules
      this.hue = Math.random() > 0.5 ? 'rgba(14, 165, 233, ' : 'rgba(99, 102, 241, ';
    }
    update(){
      this.y -= this.speed;
      this.rot += this.rotSpeed;
      if(this.y < -50) this.reset();
    }
    draw(){
      const opacity = isDark() ? this.alpha : this.alpha * 0.4;
      cx.save();
      cx.translate(this.x, this.y);
      cx.rotate(this.rot);
      cx.strokeStyle = this.hue + opacity + ')';
      cx.fillStyle = this.hue + (opacity * 0.25) + ')';
      cx.lineWidth = 1.2;

      const r = this.size;
      cx.beginPath();
      if(this.isHex) {
        // Draw 6-sided Hexagon (Medical Molecule)
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI / 3);
          const px = r * Math.cos(angle);
          const py = r * Math.sin(angle);
          if (i === 0) cx.moveTo(px, py);
          else cx.lineTo(px, py);
        }
        cx.closePath();
        cx.fill();
        cx.stroke();

        // Inner nucleus dot
        cx.beginPath();
        cx.arc(0, 0, 2, 0, Math.PI * 2);
        cx.fillStyle = this.hue + (opacity * 1.2) + ')';
        cx.fill();
      } else {
        // Draw Pill/Capsule shape
        const w = r * 1.6, h = r * 0.8;
        cx.roundRect(-w/2, -h/2, w, h, h/2);
        cx.fill();
        cx.stroke();
      }
      cx.restore();
    }
  }

  // --- 2. ECG Heartbeat Line Wave ---
  let ecgX = 0;
  const ecgSpeed = 2.5;
  const ecgPoints = [];
  const maxEcgPoints = 300;

  function getEcgY(x, baseY) {
    const cycle = (x % 350);
    // PQRST Heartbeat waveform pattern
    if (cycle > 80 && cycle < 95) {
      // P wave
      return baseY - Math.sin((cycle - 80) / 15 * Math.PI) * 12;
    } else if (cycle >= 105 && cycle < 112) {
      // Q drop
      return baseY + 10;
    } else if (cycle >= 112 && cycle < 125) {
      // R spike UP
      return baseY - 65;
    } else if (cycle >= 125 && cycle < 135) {
      // S drop DOWN
      return baseY + 25;
    } else if (cycle >= 150 && cycle < 180) {
      // T wave
      return baseY - Math.sin((cycle - 150) / 30 * Math.PI) * 18;
    }
    // Small random noise (biometric line effect)
    return baseY + (Math.random() - 0.5) * 1.5;
  }

  // --- 3. Heartbeat Pulse Rings (Sonar/Ultrasound) ---
  class PulseRing {
    constructor(){ this.reset(); }
    reset(){
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.r = 0;
      this.maxR = Math.random() * 80 + 40;
      this.speed = Math.random() * 0.8 + 0.4;
      this.alpha = 0.6;
    }
    update(){
      this.r += this.speed;
      this.alpha = 0.6 * (1 - this.r / this.maxR);
      if (this.r >= this.maxR) this.reset();
    }
    draw(){
      if (this.alpha <= 0) return;
      const opacity = isDark() ? this.alpha : this.alpha * 0.4;
      cx.beginPath();
      cx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      cx.strokeStyle = `rgba(14, 165, 233, ${opacity})`;
      cx.lineWidth = 1.2;
      cx.stroke();

      // Center dot
      cx.beginPath();
      cx.arc(this.x, this.y, 2, 0, Math.PI * 2);
      cx.fillStyle = `rgba(6, 182, 212, ${opacity * 1.5})`;
      cx.fill();
    }
  }

  // --- 4. Micro Floating Cells/Particles ---
  class BioCell {
    constructor(){ this.reset(); }
    reset(){
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.r = Math.random() * 3 + 1.5;
    }
    update(){
      this.x += this.vx; this.y += this.vy;
      if(this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
    }
    draw(){
      const a = isDark() ? 0.35 : 0.15;
      cx.beginPath();
      cx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      cx.fillStyle = `rgba(14, 165, 233, ${a})`;
      cx.fill();
    }
  }

  // Init objects
  const bioMolecules = Array.from({length: 10}, () => new BioMolecule());
  const rings = Array.from({length: 6}, () => new PulseRing());
  const cells = Array.from({length: 35}, () => new BioCell());

  let mx = W/2, my = H/2;
  window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(){
    cx.clearRect(0, 0, W, H);
    // Режим «уменьшить движение»: фон без анимации
    if (reduceMotion) { requestAnimationFrame(draw); return; }
    const dark = isDark();

    // Частицы, кольца и молекулы — только в тёмной теме; в светлой остаётся одна линия ЭКГ
    if (dark) {
    // Mouse glow spot
    {
      const mg = cx.createRadialGradient(mx, my, 0, mx, my, 280);
      mg.addColorStop(0, 'rgba(14, 165, 233, 0.08)');
      mg.addColorStop(0.5, 'rgba(99, 102, 241, 0.04)');
      mg.addColorStop(1, 'transparent');
      cx.fillStyle = mg;
      cx.fillRect(0, 0, W, H);
    }

    // --- Draw Bio Cells & Connections ---
    cells.forEach(c => { c.update(); c.draw(); });
    const lineA = isDark() ? 0.15 : 0.06;
    for(let i=0; i<cells.length; i++){
      for(let j=i+1; j<cells.length; j++){
        const dx = cells[i].x - cells[j].x;
        const dy = cells[i].y - cells[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if(d < 110){
          cx.beginPath();
          cx.moveTo(cells[i].x, cells[i].y);
          cx.lineTo(cells[j].x, cells[j].y);
          cx.strokeStyle = `rgba(14, 165, 233, ${lineA * (1 - d/110)})`;
          cx.lineWidth = 0.6;
          cx.stroke();
        }
      }
    }

    // --- Draw Pulse Rings ---
    rings.forEach(r => { r.update(); r.draw(); });

    // --- Draw Floating Bio-Molecules & Micro-Capsules ---
    bioMolecules.forEach(b => { b.update(); b.draw(); });
    }

    // --- Draw ECG Line ---
    ecgX = (ecgX + ecgSpeed) % (W + 200);
    const ecgY = getEcgY(ecgX, H * 0.45);
    ecgPoints.push({ x: ecgX, y: ecgY, alpha: 1 });
    if (ecgPoints.length > maxEcgPoints) ecgPoints.shift();

    if (ecgPoints.length > 1) {
      for (let i = 1; i < ecgPoints.length; i++) {
        const p1 = ecgPoints[i - 1];
        const p2 = ecgPoints[i];
        if (p2.x < p1.x) continue; // линия дошла до края и началась заново — не соединяем
        const age = (i / ecgPoints.length); // fade tail
        const lineAlpha = dark ? age * 0.6 : age * 0.5;

        cx.beginPath();
        cx.moveTo(p1.x, p1.y);
        cx.lineTo(p2.x, p2.y);
        // В светлой теме — основной бирюзовый цвет сайта
        cx.strokeStyle = dark ? `rgba(14, 165, 233, ${lineAlpha})` : `rgba(14, 116, 144, ${lineAlpha})`;
        cx.lineWidth = dark ? 1.8 : 2;
        cx.shadowColor = '#0ea5e9';
        cx.shadowBlur = dark ? 8 : 0;
        cx.stroke();
        cx.shadowBlur = 0; // reset
      }

      // ECG leading glowing pulse dot
      const lastP = ecgPoints[ecgPoints.length - 1];
      cx.beginPath();
      cx.arc(lastP.x, lastP.y, 3.5, 0, Math.PI * 2);
      cx.fillStyle = dark ? '#38bdf8' : '#0e7490';
      cx.shadowColor = dark ? '#38bdf8' : 'rgba(14, 116, 144, .5)';
      cx.shadowBlur = dark ? 12 : 6;
      cx.fill();
      cx.shadowBlur = 0;
    }

    requestAnimationFrame(draw);
  }

  draw();
})();

/* ================================================
   NAVBAR SCROLL
================================================ */
const nav = document.getElementById('pnav');
if(nav){
  window.addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>50));
}

/* ================================================
   AOS & LOTTIE SCROLL INIT
================================================ */
const revs = document.querySelectorAll('.reveal');
if(revs.length > 0 && window.IntersectionObserver){
  const ro = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('vis');ro.unobserve(e.target);} });
  },{threshold:0, rootMargin:'0px 0px 15% 0px'});  // срабатывает чуть раньше, чем блок войдёт в экран
  // Блоки первого экрана показываем сразу, не дожидаясь срабатывания observer
  revs.forEach(el=>{
    if (el.getBoundingClientRect().top < innerHeight * 1.15) el.classList.add('vis');
    else ro.observe(el);
  });
} else {
  revs.forEach(el=>el.classList.add('vis'));
}

/* ================================================
   MOBILE HAMBURGER MENU
================================================ */
(function(){
  const hamburger = document.getElementById('hamburger');
  const drawer    = document.getElementById('mobileDrawer');
  const overlay   = document.getElementById('mobileOverlay');
  if(!hamburger || !drawer || !overlay) return;

  function openMenu(){
    hamburger.classList.add('open');
    drawer.classList.add('open');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeMenu(){
    hamburger.classList.remove('open');
    drawer.classList.remove('open');
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  hamburger.addEventListener('click', ()=>{
    drawer.classList.contains('open') ? closeMenu() : openMenu();
  });
  overlay.addEventListener('click', closeMenu);

  // Close on ESC
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMenu(); });

  // Close when a drawer link is clicked
  drawer.querySelectorAll('a').forEach(a=>a.addEventListener('click', closeMenu));
})();

/* ================================================
   CUSTOM LANGUAGE DROPDOWN
================================================ */
(function(){
  const dropdown = document.getElementById('langDropdown');
  const btn = document.getElementById('langDropdownBtn');
  if(!dropdown || !btn) return;

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('show');
  });

  document.addEventListener('click', (e) => {
    if (!dropdown.contains(e.target)) {
      dropdown.classList.remove('show');
    }
  });
})();
</script>
